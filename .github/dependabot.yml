version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  # Historisches, hashgebundenes EXP-0003-Profil; kein Produktprofil.
  # Aktualisierungen benötigen einen neuen getrennten Qualifikationsnachweis.
  # Alerts bleiben sichtbar; nur automatische PRs für diesen Snapshot entfallen.
  - package-ecosystem: npm
    directory: /experiments/ebook/exp-0003
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
