name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Select checks for the exact change
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/governance/select_repository_quality.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
      - name: Validate project repository contracts
        run: python tools/governance/validate_repository.py
      - name: Validate artifact registry
        run: >-
          python .ai/foundation/artifact_registry_github/registry_semantic.py
          validate
          --registry .ai/artifact_registry.json
      - name: Validate WI-0005 product qualification result
        if: steps.scope.outputs.runtime_required == 'true'
        run: python tools/qualify_ebook_deep_profile.py --validate-result
      - name: Validate WI-0014 product qualification result
        if: steps.scope.outputs.runtime_required == 'true'
        run: python tools/qualify_ebook_intake_context.py --validate-result
      - name: Validate WI-0007 product qualification result
        if: steps.scope.outputs.runtime_required == 'true'
        run: python tools/qualify_calibre_readonly_profile.py --validate-result
      - name: Validate current EPUB identity product qualification result
        if: steps.scope.outputs.runtime_required == 'true'
        run: python tools/qualify_ebook_identity.py --validate-result
      - name: Validate WI-0011 product qualification result
        if: steps.scope.outputs.runtime_required == 'true'
        run: python tools/qualify_ebook_calibre_identity.py --validate-result
      - name: Run repository tests
        if: steps.scope.outputs.runtime_required == 'true'
        run: python tools/run_repository_tests.py
      - name: Compile Python sources and tools
        if: steps.scope.outputs.runtime_required == 'true'
        run: >-
          python -m compileall -q
          src/sammlungslotse
          tools/run_ebook_intake.py
          tools/run_calibre_inventory.py
          tools/run_ebook_identity.py
          tools/run_ebook_calibre_identity.py
          tools/provision_ebook_deep_profile.py
          tools/qualify_ebook_deep_profile.py
          tools/provision_calibre_readonly_profile.py
          tools/materialize_calibre_qualification_library.py
          tools/qualify_calibre_readonly_profile.py
          tools/qualify_ebook_intake_context.py
          tools/qualify_ebook_identity.py
          tools/qualify_ebook_calibre_identity.py
          tools/run_repository_tests.py
          .ai/foundation/artifact_registry_github
          .ai/foundation/rule_context_cache
          tools/governance
          tools/fixtures
          tools/experiments
          experiments/ebook/exp-0002
          experiments/ebook/exp-0003
          experiments/ebook/exp-0004
          experiments/ebook/exp-0005
          experiments/ebook/exp-0006
          experiments/ebook/exp-0007
