name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate project repository contracts
        run: python tools/governance/validate_repository.py
      - name: Validate artifact registry
        run: >-
          python .ai/foundation/artifact_registry_github/registry_semantic.py
          validate
          --registry .ai/artifact_registry.json
      - name: Validate TEST-0001 E-book fixture corpus
        run: python tools/fixtures/validate_ebook_reference_corpus.py
      - name: Validate EXP-0002 empirical result contract
        run: python tools/experiments/run_exp_0002.py --validate-result
      - name: Validate EXP-0003 empirical result contract
        run: python tools/experiments/run_exp_0003.py --validate-result
      - name: Validate EXP-0004 empirical result contract
        run: python tools/experiments/run_exp_0004.py --validate-result
      - name: Validate EXP-0005 empirical result contract
        run: python tools/experiments/run_exp_0005.py --validate-result
      - name: Validate EXP-0006 empirical result contract
        run: python tools/experiments/run_exp_0006.py --validate-result
      - name: Validate EXP-0007 empirical result contract
        run: python tools/experiments/run_exp_0007.py --validate-result
      - name: Validate WI-0005 product qualification result
        run: python tools/qualify_ebook_deep_profile.py --validate-result
      - name: Validate WI-0007 product qualification result
        run: python tools/qualify_calibre_readonly_profile.py --validate-result
      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile Python sources and tools
        run: >-
          python -m compileall -q
          src/sammlungslotse
          tools/run_ebook_intake.py
          tools/run_calibre_inventory.py
          tools/provision_ebook_deep_profile.py
          tools/qualify_ebook_deep_profile.py
          tools/provision_calibre_readonly_profile.py
          tools/qualify_calibre_readonly_profile.py
          .ai/foundation/artifact_registry_github
          tools/governance
          tools/fixtures
          tools/experiments
          experiments/ebook/exp-0002
          experiments/ebook/exp-0003
          experiments/ebook/exp-0004
          experiments/ebook/exp-0005
          experiments/ebook/exp-0006
          experiments/ebook/exp-0007
